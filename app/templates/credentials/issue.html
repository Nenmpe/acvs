{% extends "base.html" %}

{% block content %}

<div class="card shadow-sm">
    <div class="card-header bg-success text-white">
        Issue Certificate
    </div>

    <div class="card-body">
        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                {{ form.student.label_tag }}
                {{ form.student }}
            </div>

            <div class="mb-3">
                {{ form.degree_name.label_tag }}
                {{ form.degree_name }}
            </div>

            <button class="btn btn-primary">
                Issue Certificate
            </button>
        </form>
    </div>
</div>

{% endblock %}
