version: '3.9'

services:
  db:
    image: postgres:15
    container_name: acvs_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=acvs
      - POSTGRES_USER=acvs_user
      - POSTGRES_PASSWORD=acvs_pass
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: acvs_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./app:/code
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data:
